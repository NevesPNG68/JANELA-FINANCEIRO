<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Janela • Inteligência Financeira • BUILD 9</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06111c;color:#f5f8fb;font-family:Inter,Segoe UI,Arial,sans-serif}#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#06111c}.loading{max-width:760px;margin:12vh auto;padding:32px}.box{background:#0c1b2a;border:1px solid #20364b;border-radius:18px;padding:28px;box-shadow:0 18px 48px rgba(0,0,0,.25)}h1{margin:0 0 10px;font-size:22px}p{color:#91a6ba;line-height:1.6}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2bd47d;margin-right:8px;box-shadow:0 0 0 4px rgba(43,212,125,.12)}pre{white-space:pre-wrap;color:#ffaaa6;background:#081522;padding:12px;border-radius:10px}.build{position:fixed;right:8px;bottom:8px;z-index:99999;padding:4px 7px;border-radius:7px;background:#173653;color:#d9ecff;font:700 9px Segoe UI,Arial,sans-serif;border:1px solid #31506b}
</style>
</head>
<body>
<div id="loading" class="loading"><div class="box"><h1><span class="dot"></span>JANELA • Inteligência Financeira</h1><p>Carregando o painel e a base financeira...</p><div id="err"></div></div></div>
<div class="build">BUILD 9</div>
<script>
(async()=>{
  const fail=e=>{document.getElementById('err').innerHTML='<pre>'+String(e?.message||e).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+'</pre><p>BUILD 9 • envie uma captura desta tela.</p>';};
  try{
    const parts=['.build/index.part01','.build/index.part02','.build/index.part03','.build/index.part04'];
    const texts=[];
    for(const p of parts){
      const r=await fetch(p+'?build=9&v='+Date.now(),{cache:'no-store'});
      if(!r.ok)throw new Error('Falha ao carregar '+p+' (HTTP '+r.status+')');
      texts.push(await r.text());
    }
    let app='<!doctype html><html lang="pt-BR">'+texts.join('');
    app=app.replace('<head>','<head><base href="https://nevespng68.github.io/JANELA-FINANCEIRO/">');
    app=app.replaceAll('data/ESTRUTURA_JANELA.xlsx','ESTRUTURA JANELA_V02.xlsx');
    app=app.replaceAll('ESTRUTURA_JANELA.xlsx • leitura direta do GitHub','ESTRUTURA JANELA_V02.xlsx • leitura direta do GitHub');
    app=app.replaceAll('na pasta <b>data</b> com o nome <b>ESTRUTURA_JANELA.xlsx</b>','na raiz do repositório com o nome <b>ESTRUTURA JANELA_V02.xlsx</b>');
    const frame=document.createElement('iframe');
    frame.id='frame';
    frame.setAttribute('title','Janela Inteligência Financeira');
    frame.onload=()=>{document.getElementById('loading')?.remove();};
    document.body.appendChild(frame);
    frame.srcdoc=app;
  }catch(e){console.error(e);fail(e)}
})();
</script>
</body>
</html>
