<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Janela • Inteligência Financeira</title>
<style>
html,body{margin:0;min-height:100%;background:#06111c;color:#f5f8fb;font-family:Inter,Segoe UI,Arial,sans-serif}main{max-width:760px;margin:12vh auto;padding:32px}.box{background:#0c1b2a;border:1px solid #20364b;border-radius:18px;padding:28px;box-shadow:0 18px 48px rgba(0,0,0,.25)}h1{margin:0 0 10px;font-size:22px}p{color:#91a6ba;line-height:1.6}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2bd47d;margin-right:8px;box-shadow:0 0 0 4px rgba(43,212,125,.12)}pre{white-space:pre-wrap;color:#ffaaa6;background:#081522;padding:12px;border-radius:10px}
</style>
</head>
<body><main><div class="box"><h1><span class="dot"></span>JANELA • Inteligência Financeira</h1><p>Carregando o painel e a base financeira...</p><div id="err"></div></div></main>
<script>
(async()=>{
  const BUILD='8';
  const fail=(e)=>{console.error(e);document.body.innerHTML='<main><div class="box"><h1>Erro ao carregar o painel</h1><pre>'+String(e?.message||e).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+'</pre><p>BUILD '+BUILD+' • envie uma captura desta tela.</p></div></main>'};
  try{
    const parts=['.build/index.part01','.build/index.part02','.build/index.part03','.build/index.part04'];
    const texts=[];
    for(const p of parts){const r=await fetch(p+'?build='+BUILD+'&v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Falha ao carregar '+p+' (HTTP '+r.status+')');texts.push(await r.text())}
    let app=texts.join('');
    app=app.replaceAll("data/ESTRUTURA_JANELA.xlsx","ESTRUTURA JANELA_V02.xlsx");
    app=app.replaceAll("ESTRUTURA_JANELA.xlsx • leitura direta do GitHub","ESTRUTURA JANELA_V02.xlsx • leitura direta do GitHub");
    app=app.replaceAll("na pasta <b>data</b> com o nome <b>ESTRUTURA_JANELA.xlsx</b>","na raiz do repositório com o nome <b>ESTRUTURA JANELA_V02.xlsx</b>");
    app=app.replace("window.addEventListener('DOMContentLoaded',init);","if(document.readyState==='loading') window.addEventListener('DOMContentLoaded',init); else init();");
    const parsed=new DOMParser().parseFromString(app,'text/html');
    const scripts=[...parsed.querySelectorAll('script')];
    scripts.forEach(s=>s.remove());
    document.head.innerHTML=parsed.head.innerHTML;
    document.body.innerHTML=parsed.body.innerHTML;
    const badge=document.createElement('div');badge.id='buildBadge';badge.textContent='BUILD '+BUILD;badge.style.cssText='position:fixed;right:8px;bottom:8px;z-index:99999;padding:4px 7px;border-radius:7px;background:#173653;color:#d9ecff;font:700 9px Segoe UI,Arial,sans-serif;border:1px solid #31506b;opacity:.9';document.body.appendChild(badge);
    for(const old of scripts){
      await new Promise((resolve,reject)=>{
        const s=document.createElement('script');
        for(const a of old.attributes)s.setAttribute(a.name,a.value);
        if(old.src){s.onload=resolve;s.onerror=()=>reject(new Error('Não foi possível carregar '+old.src));s.src=old.src;document.body.appendChild(s)}
        else{s.textContent=old.textContent;document.body.appendChild(s);resolve()}
      });
    }
    setTimeout(()=>{const b=document.getElementById('buildBadge');if(b)b.textContent='BUILD '+BUILD+' ✓'},1200);
  }catch(e){fail(e)}
})();
</script></body></html>
